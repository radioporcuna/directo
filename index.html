<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Radio Porcuna - Emisión Online</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      color: #ffffff;
      overflow: hidden;
    }

    .player-card {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 2.5rem 2rem;
      border-radius: 24px;
      text-align: center;
      width: 90%;
      max-width: 420px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .station-name {
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: 1px;
      color: #38bdf8;
      margin-bottom: 0.2rem;
      text-transform: uppercase;
    }

    .station-tagline {
      font-size: 0.85rem;
      color: #94a3b8;
      margin-bottom: 1.5rem;
    }

    .cover-container {
      position: relative;
      width: 200px;
      height: 200px;
      margin-bottom: 1.5rem;
    }

    .cover-art {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid #38bdf8;
      box-shadow: 0 8px 25px rgba(56, 189, 248, 0.3);
      transition: all 0.5s ease-in-out;
    }

    .live-badge {
      position: absolute;
      bottom: 5px;
      right: 15px;
      background-color: #ef4444;
      color: white;
      font-size: 0.7rem;
      font-weight: bold;
      padding: 3px 8px;
      border-radius: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.4);
    }

    .track-info {
      width: 100%;
      margin-bottom: 1.5rem;
      min-height: 50px;
    }

    .song-title {
      font-size: 1.2rem;
      font-weight: 600;
      color: #f8fafc;
      margin-bottom: 0.3rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .song-artist {
      font-size: 0.95rem;
      color: #cbd5e1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .play-btn {
      background: #38bdf8;
      color: #0f172a;
      border: none;
      width: 64px;
      height: 64px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: all 0.2s ease;
      box-shadow: 0 6px 15px rgba(56, 189, 248, 0.4);
    }

    .play-btn:hover {
      transform: scale(1.08);
      background: #7dd3fc;
    }

    .play-btn svg {
      width: 28px;
      height: 28px;
      fill: currentColor;
    }
  </style>
</head>
<body>

  <div class="player-card">
    <h1 class="station-name">Radio Porcuna</h1>
    <p class="station-tagline">Emisión Online 24 Horas</p>

    <div class="cover-container">
      <img id="coverArt" class="cover-art" src="logo.png" alt="Radio Porcuna">
      <span class="live-badge">EN VIVO</span>
    </div>

    <div class="track-info">
      <div id="songTitle" class="song-title">Conectando al servidor...</div>
      <div id="songArtist" class="song-artist">Radio Porcuna Online</div>
    </div>

    <button id="playBtn" class="play-btn" aria-label="Reproducir">
      <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      <svg id="pauseIcon" viewBox="0 0 24 24" style="display:none;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
    </button>
  </div>

  <script>
    const streamUrl = "https://canalretrohits.online:8443/stream";
    const playBtn = document.getElementById('playBtn');
    const playIcon = document.getElementById('playIcon');
    const pauseIcon = document.getElementById('pauseIcon');
    const songTitle = document.getElementById('songTitle');
    const songArtist = document.getElementById('songArtist');
    const coverArt = document.getElementById('coverArt');

    const DEFAULT_LOGO = 'logo.png';
    let currentTrack = "";
    
    let audio = new Audio();
    audio.preload = "none";

    playBtn.addEventListener('click', () => {
      if (audio.paused) {
        if (!audio.src) {
          audio.src = streamUrl;
        }
        audio.play().then(() => {
          playIcon.style.display = 'none';
          pauseIcon.style.display = 'block';
        }).catch(err => {
          console.log("Error al reproducir: ", err);
        });
      } else {
        audio.pause();
        audio.src = "";
        playIcon.style.display = 'block';
        pauseIcon.style.display = 'none';
      }
    });

    async function fetchCoverArt(artist, title) {
      try {
        const query = encodeURIComponent(`${artist} ${title}`);
        const response = await fetch(`https://itunes.apple.com/search?term=${query}&entity=song&limit=1`);
        const data = await response.json();

        if (data.results && data.results.length > 0) {
          let artworkUrl = data.results[0].artworkUrl100.replace('100x100bb', '600x600bb');
          coverArt.src = artworkUrl;
        } else {
          coverArt.src = DEFAULT_LOGO;
        }
      } catch (e) {
        coverArt.src = DEFAULT_LOGO;
      }
    }

    async function updateMetadata() {
      try {
        const response = await fetch('https://canalretrohits.online:8443/status-json.xsl');
        const data = await response.json();
        
        if (data && data.icestats && data.icestats.source) {
          let source = data.icestats.source;
          if (Array.isArray(source)) source = source[0];
          
          if (source.title && source.title !== currentTrack) {
            currentTrack = source.title;
            const parts = source.title.split(' - ');
            
            let artistName = "Radio Porcuna";
            let trackName = source.title;

            if (parts.length > 1) {
              artistName = parts[0].trim();
              trackName = parts.slice(1).join(' - ').trim();
            }

            songArtist.textContent = artistName;
            songTitle.textContent = trackName;

            fetchCoverArt(artistName, trackName);
          }
        }
      } catch (error) {
        if (songTitle.textContent === "Conectando al servidor...") {
          songTitle.textContent = "Radio Porcuna";
          songArtist.textContent = "Emisión Online";
        }
      }
    }

    updateMetadata();
    setInterval(updateMetadata, 3000);
  </script>

</body>
</html>

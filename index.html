<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Radio Porcuna - En Directo</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #000000;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .radio-card {
      background: linear-gradient(135deg, #1a1a1a, #2c1e1e);
      color: #fff;
      padding: 25px 20px;
      width: 320px;
      border-radius: 16px;
      border: 2px solid #ff3333;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      text-align: center;
      box-sizing: border-box;
    }

    .logo-container {
      position: relative;
      width: 150px;
      height: 150px;
      margin: 0 auto 15px auto;
      border-radius: 12px;
      background: #111;
      border: 2px solid #ff3333;
      box-shadow: 0 4px 15px rgba(255,51,51,0.4);
      overflow: hidden;
    }

    .logo-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    h3 {
      margin: 0;
      font-size: 24px;
      color: #ffffff;
      font-weight: 700;
    }

    .subtitle {
      margin: 4px 0 15px 0;
      font-size: 13px;
      color: #ff9999;
    }

    .metadata-box {
      background: rgba(0, 0, 0, 0.6);
      padding: 12px 15px;
      border-radius: 10px;
      margin-bottom: 20px;
      border-left: 4px solid #ff3333;
      text-align: left;
    }

    .metadata-title {
      font-size: 10px;
      color: #ff6666;
      font-weight: bold;
      text-transform: uppercase;
      margin-bottom: 3px;
    }

    #now-playing {
      margin: 0;
      font-size: 14px;
      color: #ffffff;
      font-weight: 500;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #play-btn {
      background: #ff3333;
      color: #ffffff;
      border: none;
      padding: 14px 20px;
      font-size: 15px;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 5px 15px rgba(255, 51, 51, 0.4);
      width: 100%;
    }

    #play-btn:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>

  <div class="radio-card">
    <div class="logo-container">
      <img id="album-art" src="https://cdn-profiles.tunein.com/s225357/images/logog.jpg?t=156985" alt="Radio Porcuna">
    </div>

    <h3>Radio Porcuna</h3>
    <p class="subtitle">La radio de nuestra tierra</p>

    <div class="metadata-box">
      <div class="metadata-title">Sonando ahora:</div>
      <p id="now-playing">Radio Porcuna - En directo</p>
    </div>

    <audio id="stream-audio" src="https://canalretrohits.online:8443/stream" preload="auto"></audio>

    <button id="play-btn" onclick="startStream()">
      ESCUCHAR EN DIRECTO
    </button>
  </div>

  <script>
    const audio = document.getElementById('stream-audio');
    const playBtn = document.getElementById('play-btn');
    const nowPlaying = document.getElementById('now-playing');
    const albumArt = document.getElementById('album-art');
    
    const DEFAULT_LOGO = "https://cdn-profiles.tunein.com/s225357/images/logog.jpg?t=156985";
    const ICECAST_URL = "https://canalretrohits.online:8443/status-json.xsl";
    let lastTrack = "";

    window.addEventListener('DOMContentLoaded', () => {
      audio.load();
    });

    function startStream() {
      if (audio.paused) {
        audio.play().then(() => {
          playBtn.innerText = "EN DIRECTO (REPRODUCIENDO)";
          playBtn.style.background = "#cc0000";
        }).catch(error => {
          console.log("Error al reproducir:", error);
        });
      } else {
        audio.pause();
        playBtn.innerText = "ESCUCHAR EN DIRECTO";
        playBtn.style.background = "#ff3333";
      }
    }

    function updateMetadata() {
      fetch(ICECAST_URL, { cache: 'no-store' })
        .then(response => response.json())
        .then(data => {
          let source = data.icestats && data.icestats.source;
          if (source) {
            if (Array.isArray(source)) {
              source = source.find(s => s.listenurl && s.listenurl.includes('stream')) || source[0];
            }
            if (source && source.title) {
              let rawTitle = source.title.trim();
              
              if (rawTitle !== lastTrack) {
                lastTrack = rawTitle;
                
                // Limpiar numeración de ZaraRadio (ej: "30. ")
                let cleanTitle = rawTitle.replace(/^\d+\.\s*/, '');
                nowPlaying.innerText = cleanTitle;

                // Buscar carátula en iTunes
                fetchCover(cleanTitle);
              }
            }
          }
        })
        .catch(err => {
          console.log("Error consultando metadatos Icecast:", err);
        });
    }

    function fetchCover(fullTitle) {
      // Limpiar paréntesis y textos largos para que iTunes encuentre la carátula fácilmente
      let queryTitle = fullTitle.replace(/\s*\(.*?\)/g, '').trim();
      
      fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(queryTitle)}&media=music&limit=1`)
        .then(res => res.json())
        .then(json => {
          if (json.results && json.results.length > 0) {
            let highResCover = json.results[0].artworkUrl100.replace('100x100bb', '600x600bb');
            albumArt.src = highResCover;
          } else {
            albumArt.src = DEFAULT_LOGO;
          }
        })
        .catch(() => {
          albumArt.src = DEFAULT_LOGO;
        });
    }

    setInterval(updateMetadata, 5000);
    updateMetadata();
  </script>
</body>
</html>

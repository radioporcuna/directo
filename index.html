<div style="background: linear-gradient(135deg, #1a1a1a, #2c1e1e); color: #fff; padding: 25px; border-radius: 16px; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; max-width: 420px; margin: 20px auto; box-shadow: 0 10px 30px rgba(0,0,0,0.6); text-align: center; border: 2px solid #ff3333;">
  
  <!-- Logotipo oficial de Radio Porcuna en el círculo superior -->
  <div style="position: relative; width: 130px; height: 130px; margin: 0 auto 15px auto; border-radius: 50%; background: #111; border: 4px solid #ff3333; box-shadow: 0 4px 15px rgba(255,51,51,0.4); overflow: hidden;">
    <img src="https://cdn-profiles.tunein.com/s225357/images/logog.jpg?t=156985" alt="Radio Porcuna" style="width: 100%; height: 100%; object-fit: cover;">
  </div>

  <!-- Título Radio Porcuna -->
  <h3 style="margin: 0 0 5px 0; font-size: 22px; color: #ffffff; font-weight: 700; letter-spacing: 0.5px;">Radio Porcuna</h3>
  <p style="margin: 0 0 15px 0; font-size: 13px; color: #ff9999;">La radio de nuestra tierra</p>

  <!-- Caja de la canción actual -->
  <div style="background: rgba(0,0,0,0.5); padding: 12px 18px; border-radius: 10px; margin-bottom: 20px; border-left: 4px solid #ff3333; text-align: left;">
    <div style="font-size: 11px; color: #ff6666; font-weight: bold; text-transform: uppercase; margin-bottom: 3px;">Sonando ahora:</div>
    <p id="now-playing" style="margin: 0; font-size: 14px; color: #ffffff; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">Radio Porcuna - En directo</p>
  </div>

  <!-- Elemento de Audio con precarga automática -->
  <audio id="stream-audio" src="https://canalretrohits.online:8443/stream" preload="auto"></audio>

  <!-- Botón de Play directo -->
  <button id="play-btn" onclick="startStream()" style="background: #ff3333; color: #ffffff; border: none; padding: 14px 35px; font-size: 16px; font-weight: bold; border-radius: 30px; cursor: pointer; transition: all 0.3s ease; box-shadow: 0 5px 15px rgba(255,51,51,0.4); width: 100%;">
    ESCUCHAR EN DIRECTO
  </button>
</div>

<script>
  const audio = document.getElementById('stream-audio');
  const playBtn = document.getElementById('play-btn');
  const nowPlaying = document.getElementById('now-playing');

  // Precarga la conexión en segundo plano nada más cargar la página web
  window.addEventListener('DOMContentLoaded', () => {
    audio.load();
  });

  function startStream() {
    audio.play().then(() => {
      playBtn.innerText = "EN DIRECTO (REPRODUCIENDO)";
      playBtn.style.background = "#cc0000";
    }).catch(error => {
      console.log("Error al reproducir:", error);
    });
  }

  function updateMetadata() {
    fetch('https://api.allorigins.win/get?url=' + encodeURIComponent('https://canalretrohits.online:8443/status-json.xsl'))
      .then(response => {
        if (response.ok) return response.json();
        throw new Error('Network response was not ok');
      })
      .then(data => {
        const parsedData = JSON.parse(data.contents);
        let source = parsedData.icestats.source;
        if (source) {
          if (Array.isArray(source)) {
            source = source.find(s => s.listenurl && s.listenurl.includes('stream')) || source[0];
          }
          if (source && source.title) {
            nowPlaying.innerText = source.title;
          }
        }
      })
      .catch(err => {});
  }

  setInterval(updateMetadata, 10000);
  updateMetadata();
</script>

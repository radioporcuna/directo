<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radio Porcuna</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #121212;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 360px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        /* Carátula / Logo circular */
        .artwork-container {
            width: 220px;
            height: 220px;
            border-radius: 50%;
            margin-bottom: 25px;
            box-shadow: 0 0 25px rgba(255, 30, 60, 0.6);
            overflow: hidden;
            border: 3px solid #ff2e4d;
            background-color: #000;
        }

        .artwork {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 6px;
            letter-spacing: -0.5px;
        }

        .subtitle {
            font-size: 1.05rem;
            color: #ff7b89;
            margin-bottom: 30px;
            font-weight: 400;
        }

        /* Caja de Sonando Ahora */
        .now-playing-box {
            width: 100%;
            background-color: #1a1a1a;
            border-radius: 14px;
            padding: 16px 20px;
            text-align: left;
            margin-bottom: 30px;
            border-left: 4px solid #ff2e4d;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .now-playing-label {
            font-size: 0.75rem;
            font-weight: 700;
            color: #ff2e4d;
            letter-spacing: 1px;
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        .now-playing-title {
            font-size: 1rem;
            font-weight: 600;
            color: #ffffff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .now-playing-artist {
            font-size: 0.85rem;
            color: #a0a0a0;
            margin-top: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Botón de reproducción */
        .play-btn {
            width: 100%;
            background: linear-gradient(180deg, #ff4d6d 0%, #ff1e3c 100%);
            color: #ffffff;
            border: none;
            border-radius: 35px;
            padding: 18px 20px;
            font-size: 1.1rem;
            font-weight: 800;
            letter-spacing: 0.5px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(255, 30, 60, 0.4);
            transition: transform 0.1s ease, box-shadow 0.1s ease;
        }

        .play-btn:active {
            transform: scale(0.98);
            box-shadow: 0 3px 10px rgba(255, 30, 60, 0.3);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Carátula que cambia dinámicamente con iTunes (o logo por defecto) -->
        <div class="artwork-container">
            <img id="artwork" src="logo.png" alt="Radio Porcuna" class="artwork">
        </div>

        <h1>Radio Porcuna</h1>
        <div class="subtitle">La radio de nuestra tierra</div>

        <!-- Bloque Sonando Ahora -->
        <div class="now-playing-box">
            <div class="now-playing-label">SONANDO AHORA:</div>
            <div id="songTitle" class="now-playing-title">Radio Porcuna - En directo</div>
            <div id="songArtist" class="now-playing-artist">106.9 FM</div>
        </div>

        <!-- Botón Play -->
        <button id="playBtn" class="play-btn">ESCUCHAR EN DIRECTO</button>

        <!-- Elemento de Audio Oculto -->
        <audio id="audioStream" preload="none">
            <!-- PONES AQUÍ LA URL DE TU ICECAST -->
            <source src="http://tu-servidor-icecast:puerto/stream" type="audio/mpeg">
        </audio>
    </div>

    <script>
        const audio = document.getElementById('audioStream');
        const playBtn = document.getElementById('playBtn');
        const artwork = document.getElementById('artwork');
        const songTitle = document.getElementById('songTitle');
        const songArtist = document.getElementById('songArtist');

        // Logo original por defecto
        const defaultLogo = 'logo.png'; 

        // Control de Play/Pausa
        let isPlaying = false;

        playBtn.addEventListener('click', () => {
            if (!isPlaying) {
                audio.play();
                playBtn.innerText = "PAUSAR EMISIÓN";
                isPlaying = true;
            } else {
                audio.pause();
                playBtn.innerText = "ESCUCHAR EN DIRECTO";
                isPlaying = false;
            }
        });

        // Consulta a iTunes API para obtener carátula y datos
        async function fetchITunesData(query) {
            if (!query || query.includes("Radio Porcuna")) {
                artwork.src = defaultLogo;
                songTitle.innerText = "Radio Porcuna - En directo";
                songArtist.innerText = "106.9 FM";
                return;
            }

            try {
                // Limpia nombres si hiciera falta
                let cleanQuery = query.trim();
                let response = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(cleanQuery)}&media=music&limit=1`);
                let data = await response.json();

                if (data.results && data.results.length > 0) {
                    let track = data.results[0];
                    // Pide la imagen en alta resolución de iTunes (600x600)
                    let highResArtwork = track.artworkUrl100.replace('100x100bb', '600x600bb');
                    artwork.src = highResArtwork;
                    songTitle.innerText = track.trackName;
                    songArtist.innerText = track.artistName;
                } else {
                    // Si no la encuentra en iTunes, muestra el título que envía la radio
                    artwork.src = defaultLogo;
                    songTitle.innerText = query;
                    songArtist.innerText = "Radio Porcuna 106.9 FM";
                }
            } catch (error) {
                console.error("Error iTunes API:", error);
                artwork.src = defaultLogo;
            }
        }

        // Lectura de título (conecta con status-json.xsl de Icecast o tu fuente de metadatos)
        async function checkMetadata() {
            try {
                let response = await fetch('http://tu-servidor-icecast:puerto/status-json.xsl');
                let data = await response.json();
                let currentTrack = data.sourcestats.title;

                if (currentTrack && currentTrack !== window.lastTrack) {
                    window.lastTrack = currentTrack;
                    fetchITunesData(currentTrack);
                }
            } catch (e) {
                // Si la consulta da error mantiene el logo base
            }
        }

        // Revisa cambios cada 8 segundos
        setInterval(checkMetadata, 8000);
    </script>
</body>
</html>

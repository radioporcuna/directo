<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radio Porcuna</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #121212;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 360px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        /* Carátula / Logo circular */
        .artwork-container {
            width: 220px;
            height: 220px;
            border-radius: 50%;
            margin-bottom: 25px;
            box-shadow: 0 0 25px rgba(255, 30, 60, 0.6);
            overflow: hidden;
            border: 3px solid #ff2e4d;
            background-color: #000000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .artwork {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 6px;
            letter-spacing: -0.5px;
        }

        .subtitle {
            font-size: 1.05rem;
            color: #ff7b89;
            margin-bottom: 30px;
            font-weight: 400;
        }

        /* Caja Sonando Ahora */
        .now-playing-box {
            width: 100%;
            background-color: #1a1a1a;
            border-radius: 14px;
            padding: 16px 20px;
            text-align: left;
            margin-bottom: 30px;
            border-left: 4px solid #ff2e4d;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .now-playing-label {
            font-size: 0.75rem;
            font-weight: 700;
            color: #ff2e4d;
            letter-spacing: 1px;
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        .now-playing-title {
            font-size: 1rem;
            font-weight: 600;
            color: #ffffff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .now-playing-artist {
            font-size: 0.85rem;
            color: #a0a0a0;
            margin-top: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Botón de reproducción */
        .play-btn {
            width: 100%;
            background: linear-gradient(180deg, #ff4d6d 0%, #ff1e3c 100%);
            color: #ffffff;
            border: none;
            border-radius: 35px;
            padding: 18px 20px;
            font-size: 1.1rem;
            font-weight: 800;
            letter-spacing: 0.5px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(255, 30, 60, 0.4);
        }

        .play-btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Logo circular oficial de la emisora -->
        <div class="artwork-container">
            <img id="artwork" class="artwork" src="https://cdn-profiles.tunein.com/s225357/images/logog.jpg" alt="Radio Porcuna">
        </div>

        <h1>Radio Porcuna</h1>
        <div class="subtitle">La radio de nuestra tierra</div>

        <!-- Bloque Sonando Ahora -->
        <div class="now-playing-box">
            <div class="now-playing-label">SONANDO AHORA:</div>
            <div id="songTitle" class="now-playing-title">Radio Porcuna - En directo</div>
            <div id="songArtist" class="now-playing-artist">106.9 FM</div>
        </div>

        <!-- Botón Play -->
        <button id="playBtn" class="play-btn">ESCUCHAR EN DIRECTO</button>
    </div>

    <script>
        const URL_LOGO_BASE = "https://cdn-profiles.tunein.com/s225357/images/logog.jpg"; 
        const STREAM_URL = "https://canalretrohits.online:8443/stream";

        const playBtn = document.getElementById('playBtn');
        const artwork = document.getElementById('artwork');
        const songTitle = document.getElementById('songTitle');
        const songArtist = document.getElementById('songArtist');

        const audio = new Audio();
        let isPlaying = false;

        playBtn.addEventListener('click', () => {
            if (!isPlaying) {
                audio.src = STREAM_URL;
                audio.play().then(() => {
                    playBtn.innerText = "PAUSAR EMISIÓN";
                    isPlaying = true;
                }).catch(err => {
                    console.error("Error al reproducir audio:", err);
                    alert("No se pudo iniciar el audio. Comprueba la conexión al streaming.");
                });
            } else {
                audio.pause();
                audio.src = "";
                playBtn.innerText = "ESCUCHAR EN DIRECTO";
                isPlaying = false;
            }
        });

        // Búsqueda de carátulas en la API de iTunes
        async function fetchITunesData(query) {
            if (!query || query.includes("Radio Porcuna") || query.includes("En directo")) {
                artwork.src = URL_LOGO_BASE;
                songTitle.innerText = "Radio Porcuna - En directo";
                songArtist.innerText = "106.9 FM";
                return;
            }

            try {
                let response = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(query)}&media=music&limit=1`);
                let data = await response.json();

                if (data.results && data.results.length > 0) {
                    let track = data.results[0];
                    artwork.src = track.artworkUrl100.replace('100x100bb', '600x600bb');
                    songTitle.innerText = track.trackName;
                    songArtist.innerText = track.artistName;
                } else {
                    artwork.src = URL_LOGO_BASE;
                    let parts = query.split('-');
                    if (parts.length > 1) {
                        songArtist.innerText = parts[0].trim();
                        songTitle.innerText = parts.slice(1).join('-').trim();
                    } else {
                        songTitle.innerText = query;
                        songArtist.innerText = "Radio Porcuna 106.9 FM";
                    }
                }
            } catch (error) {
                artwork.src = URL_LOGO_BASE;
            }
        }
    </script>
</body>
</html>

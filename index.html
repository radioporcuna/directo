<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Radio Porcuna - En Directo</title>
  <style>
    /* Forzar pantalla completa absoluta sin márgenes ni scroll */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #000000;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    /* Tarjeta del reproductor adaptada a pantalla completa en móviles */
    .radio-card {
      background: linear-gradient(135deg, #1a1a1a, #2c1e1e);
      color: #fff;
      padding: 30px 20px;
      width: 100%;
      height: 100%;
      max-width: 100%;
      max-height: 100%;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      border: none;
      box-shadow: none;
      border-radius: 0;
    }

    /* Contenedor interno para mantener la elegancia en pantallas grandes o tablets */
    @media (min-width: 600px) {
      .radio-card {
        max-width: 450px;
        height: auto;
        border-radius: 16px;
        border: 2px solid #ff3333;
        box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        padding: 30px;
      }
    }

    /* Logotipo oficial de Radio Porcuna */
    .logo-container {
      position: relative;
      width: 140px;
      height: 140px;
      margin: 0 auto 20px auto;
      border-radius: 50%;
      background: #111;
      border: 4px solid #ff3333;
      box-shadow: 0 4px 15px rgba(255,51,51,0.4);
      overflow: hidden;
    }

    .logo-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    h3 {
      margin: 0;
      font-size: 26px;
      color: #ffffff;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .subtitle {
      margin: 5px 0 25px 0;
      font-size: 14px;
      color: #ff9999;
    }

    /* Caja de la canción actual */
    .metadata-box {
      background: rgba(0, 0, 0, 0.6);
      padding: 15px 20px;
      border-radius: 12px;
      margin-bottom: 25px;
      border-left: 4px solid #ff3333;
      text-align: left;
      width: 85%;
      max-width: 380px;
    }

    .metadata-title {
      font-size: 11px;
      color: #ff6666;
      font-weight: bold;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    #now-playing {
      margin: 0;
      font-size: 15px;
      color: #ffffff;
      font-weight: 500;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* Botón de Play grande y cómodo para móviles */
    #play-btn {
      background: #ff3333;
      color: #ffffff;
      border: none;
      padding: 16px 35px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 35px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 5px 20px rgba(255, 51, 51, 0.5);
      width: 85%;
      max-width: 380px;
    }

    #play-btn:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>

  <div class="radio-card">
    <!-- Logotipo oficial -->
    <div class="logo-container">
      <img src="https://cdn-profiles.tunein.com/s225357/images/logog.jpg?t=156985" alt="Radio Porcuna">
    </div>

    <!-- Títulos -->
    <h3>Radio Porcuna</h3>
    <p class="subtitle">La radio de nuestra tierra</p>

    <!-- Caja de metadatos (Canción actual) -->
    <div class="metadata-box">
      <div class="metadata-title">Sonando ahora:</div>
      <p id="now-playing">Radio Porcuna - En directo</p>
    </div>

    <!-- Elemento de Audio -->
    <audio id="stream-audio" src="https://canalretrohits.online:8443/stream" preload="auto"></audio>

    <!-- Botón de Play -->
    <button id="play-btn" onclick="startStream()">
      ESCUCHAR EN DIRECTO
    </button>
  </div>

  <script>
    const audio = document.getElementById('stream-audio');
    const playBtn = document.getElementById('play-btn');
    const nowPlaying = document.getElementById('now-playing');

    // Precarga el flujo en segundo plano
    window.addEventListener('DOMContentLoaded', () => {
      audio.load();
    });

    function startStream() {
      audio.play().then(() => {
        playBtn.innerText = "EN DIRECTO (REPRODUCIENDO)";
        playBtn.style.background = "#cc0000";
      }).catch(error => {
        console.log("Error al reproducir:", error);
      });
    }

    function updateMetadata() {
      fetch('https://api.allorigins.win/get?url=' + encodeURIComponent('https://canalretrohits.online:8443/status-json.xsl'))
        .then(response => {
          if (response.ok) return response.json();
          throw new Error('Network response was not ok');
        })
        .then(data => {
          const parsedData = JSON.parse(data.contents);
          let source = parsedData.icestats.source;
          if (source) {
            if (Array.isArray(source)) {
              source = source.find(s => s.listenurl && s.listenurl.includes('stream')) || source[0];
            }
            if (source && source.title) {
              nowPlaying.innerText = source.title;
            }
          }
        })
        .catch(err => {});
    }

    setInterval(updateMetadata, 2000);
    updateMetadata();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radio Porcuna</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #121212;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
            padding: 10px;
        }

        /* Contenedor central vertical compacto */
        .container {
            width: 100%;
            max-width: 340px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        /* Carátula / Logo circular principal mucho más pequeño y fino */
        .artwork-container {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            margin-bottom: 8px;
            box-shadow: 0 0 10px rgba(255, 30, 60, 0.4);
            overflow: hidden;
            border: 2px solid #ff2e4d;
            background-color: #000000;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .artwork {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            border-radius: 50%;
        }

        h1 {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 2px;
            letter-spacing: -0.5px;
        }

        .subtitle {
            font-size: 0.75rem;
            color: #ff7b89;
            margin-bottom: 10px;
            font-weight: 400;
        }

        /* Caja Sonando Ahora */
        .now-playing-box {
            width: 100%;
            background-color: #1a1a1a;
            border-radius: 10px;
            padding: 10px 14px;
            text-align: left;
            margin-bottom: 10px;
            border-left: 3px solid #ff2e4d;
            box-shadow: 0 3px 12px rgba(0,0,0,0.3);
        }

        .now-playing-label {
            font-size: 0.6rem;
            font-weight: 700;
            color: #ff2e4d;
            letter-spacing: 0.5px;
            margin-bottom: 2px;
            text-transform: uppercase;
        }

        .now-playing-title {
            font-size: 0.8rem;
            font-weight: 600;
            color: #ffffff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .now-playing-artist {
            font-size: 0.7rem;
            color: #a8a8a8;
            margin-top: 1px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Botón Play */
        .play-btn {
            width: 100%;
            background: linear-gradient(180deg, #ff4d6d 0%, #ff1e3c 100%);
            color: #ffffff;
            border: none;
            border-radius: 25px;
            padding: 10px 16px;
            font-size: 0.85rem;
            font-weight: 800;
            letter-spacing: 0.5px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 30, 60, 0.4);
            margin-bottom: 12px;
        }

        .play-btn:active {
            transform: scale(0.98);
        }

        /* SECCIÓN INFERIOR: Las 4 cajitas debajo del botón */
        .historial-seccion {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .historial-titulo-seccion {
            font-size: 0.6rem;
            font-weight: 700;
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 2px;
            text-align: left;
        }

        .track-box-historial {
            width: 100%;
            background-color: #1a1a1a;
            border-radius: 8px;
            padding: 5px 8px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-left: 3px solid #ff2e4d;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-left-width: 3px;
        }

        .historial-thumb {
            width: 28px;
            height: 28px;
            border-radius: 4px;
            object-fit: cover;
            background-color: #000;
            flex-shrink: 0;
        }

        .historial-info {
            display: flex;
            flex-direction: column;
            overflow: hidden;
            text-align: left;
            width: 100%;
        }

        .track-label-historial {
            font-size: 0.45rem;
            font-weight: 700;
            color: #ff2e4d;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .track-title-historial {
            font-size: 0.65rem;
            font-weight: 600;
            color: #ffffff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .track-artist-historial {
            font-size: 0.55rem;
            color: #a8a8a8;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
    </style>
</head>
<body>

    <!-- REPRODUCTOR CENTRAL COMPACTO -->
    <div class="container">
        <div id="artwork-container">
            <img id="artwork" class="artwork" src="https://cdn-profiles.tunein.com/s225357/images/logog.jpg" alt="Logo">
        </div>
        <h1>Radio Porcuna</h1>
        <div id="subtitulo-rotativo" class="subtitle">La radio de nuestra tierra</div>
        
        <div class="now-playing-box">
            <div class="now-playing-label">SONANDO AHORA:</div>
            <div id="songTitle" class="now-playing-title">Radio Porcuna - En directo</div>
            <div id="songArtist" class="now-playing-artist">106.9 FM</div>
        </div>

        <button id="playBtn" class="play-btn">ESCUCHAR EN DIRECTO</button>

        <!-- CAJITAS ANTERIORES DEBAJO DEL BOTÓN -->
        <div class="historial-seccion">
            <div class="historial-titulo-seccion">Anteriores</div>
            
            <div class="track-box-historial">
                <img id="thumb-1" class="historial-thumb" src="https://cdn-profiles.tunein.com/s225357/images/logog.jpg" alt="Portada">
                <div class="historial-info">
                    <div class="track-label-historial">Anterior 1</div>
                    <div id="hist-title-1" class="track-title-historial">Cargando...</div>
                    <div id="hist-artist-1" class="track-artist-historial">-</div>
                </div>
            </div>

            <div class="track-box-historial">
                <img id="thumb-2" class="historial-thumb" src="https://cdn-profiles.tunein.com/s225357/images/logog.jpg" alt="Portada">
                <div class="historial-info">
                    <div class="track-label-historial">Anterior 2</div>
                    <div id="hist-title-2" class="track-title-historial">Cargando...</div>
                    <div id="hist-artist-2" class="track-artist-historial">-</div>
                </div>
            </div>

            <div class="track-box-historial">
                <img id="thumb-3" class="historial-thumb" src="https://cdn-profiles.tunein.com/s225357/images/logog.jpg" alt="Portada">
                <div class="historial-info">
                    <div class="track-label-historial">Anterior 3</div>
                    <div id="hist-title-3" class="track-title-historial">Cargando...</div>
                    <div id="hist-artist-3" class="track-artist-historial">-</div>
                </div>
            </div>

            <div class="track-box-historial">
                <img id="thumb-4" class="historial-thumb" src="https://cdn-profiles.tunein.com/s225357/images/logog.jpg" alt="Portada">
                <div class="historial-info">
                    <div class="track-label-historial">Anterior 4</div>
                    <div id="hist-title-4" class="track-title-historial">Cargando...</div>
                    <div id="hist-artist-4" class="track-artist-historial">-</div>
                </div>
            </div>
        </div>

    </div>

    <script>
        const DEFAULT_LOGO = "https://cdn-profiles.tunein.com/s225357/images/logog.jpg";
        const STREAM_URL = "https://canalretrohits.online:8443/stream";
        const METADATA_URL = "https://canalretrohits.online:8443/status-json.xsl";

        const listaFrases = [
            "La radio de nuestra tierra",
            "Online las 24 horas sin parar",
            "El sonido de los 90s en directo",
            "Conecta con los mejores recuerdos"
        ];

        let indiceActual = 0;
        const elementosubtitulo = document.getElementById("subtitulo-rotativo");
        
        function cambiarTextoRotativo() {
            indiceActual = (indiceActual + 1) % listaFrases.length;
            if (elementosubtitulo) {
                elementosubtitulo.textContent = listaFrases[indiceActual];
            }
        }
        setInterval(cambiarTextoRotativo, 5000);

        const playBtn = document.getElementById('playBtn');
        const artwork = document.getElementById('artwork');
        const songTitle = document.getElementById('songTitle');
        const songArtist = document.getElementById('songArtist');

        const audio = new Audio();
        let isPlaying = false;
        let lastRawTrack = "";

        let wakeLock = null;
        async function requestWakeLock() {
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                    wakeLock.addEventListener('release', () => { wakeLock = null; });
                }
            } catch (err) {}
        }

        document.addEventListener('visibilitychange', async () => {
            if (wakeLock === null && document.visibilityState === 'visible' && isPlaying) {
                await requestWakeLock();
            }
        });

        playBtn.addEventListener('click', async () => {
            if (!isPlaying) {
                audio.src = STREAM_URL + "?nocache=" + Date.now();
                try {
                    await audio.play();
                    playBtn.innerText = "PAUSAR EMISIÓN";
                    isPlaying = true;
                    await requestWakeLock();
                } catch (err) {
                    alert("No se pudo conectar a la emisión.");
                }
            } else {
                audio.pause();
                audio.src = "";
                playBtn.innerText = "ESCUCHAR EN DIRECTO";
                isPlaying = false;
                if (wakeLock !== null) {
                    await wakeLock.release();
                    wakeLock = null;
                }
            }
        });

        async function fetchArtworkUrl(artist, title) {
            let cleanTitle = title.replace(/\([^)]*\)/g, '').trim();
            let query = `${artist} ${cleanTitle}`.trim();
            try {
                let res = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(query)}&media=music&limit=1`);
                let data = await res.json();
                if (data.results && data.results.length > 0) {
                    return data.results[0].artworkUrl100.replace('100x100bb', '600x600bb');
                } else {
                    let resFallback = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(artist)}&media=music&limit=1`);
                    let dataFallback = await resFallback.json();
                    if (dataFallback.results && dataFallback.results.length > 0) {
                        return dataFallback.results[0].artworkUrl100.replace('100x100bb', '600x600bb');
                    }
                }
            } catch (e) {}
            return DEFAULT_LOGO;
        }

        async function processTrackInfo(rawTrack) {
            if (!rawTrack || rawTrack.trim() === "" || rawTrack.includes("Radio Porcuna")) {
                songTitle.innerText = "Radio Porcuna - En directo";
                songArtist.innerText = "106.9 FM";
                artwork.src = DEFAULT_LOGO;
                return;
            }

            let parts = rawTrack.split('-');
            let artist = "";
            let title = "";

            if (parts.length > 1) {
                artist = parts[0].trim();
                title = parts.slice(1).join(' - ').trim();
            } else {
                artist = "Radio Porcuna 106.9 FM";
                title = rawTrack.trim();
            }

            songTitle.innerText = title;
            songArtist.innerText = artist;

            let currentCover = await fetchArtworkUrl(artist, title);
            artwork.src = currentCover;

            let historial = JSON.parse(localStorage.getItem("radio_historial_porcuna_v7")) || [];
            
            if (historial.length === 0 || historial[0].raw !== rawTrack) {
                historial.unshift({
                    raw: rawTrack,
                    title: title,
                    artist: artist,
                    cover: currentCover
                });
                if (historial.length > 4) historial.pop();
                localStorage.setItem("radio_historial_porcuna_v7", JSON.stringify(historial));
            } else {
                historial[0].cover = currentCover;
                localStorage.setItem("radio_historial_porcuna_v7", JSON.stringify(historial));
            }

            actualizarPantallaHistorial(historial);
        }

        function actualizarPantallaHistorial(historial) {
            for (let i = 0; i < 4; i++) {
                let titleEl = document.getElementById(`hist-title-${i+1}`);
                let artistEl = document.getElementById(`hist-artist-${i+1}`);
                let thumbEl = document.getElementById(`thumb-${i+1}`);
                
                if (historial[i]) {
                    if(titleEl) { titleEl.textContent = historial[i].title; titleEl.title = historial[i].title; }
                    if(artistEl) { artistEl.textContent = historial[i].artist; artistEl.title = historial[i].artist; }
                    if(thumbEl) { thumbEl.src = historial[i].cover; }
                } else {
                    if(titleEl) titleEl.textContent = "En emisión...";
                    if(artistEl) titleEl.textContent = "Radio Porcuna";
                    if(thumbEl) thumbEl.src = DEFAULT_LOGO;
                }
            }
        }

        async function fetchMetadata() {
            let track = "";
            try {
                let response = await fetch(METADATA_URL, { cache: "no-store" });
                let data = await response.json();
                track = extractTrackFromJSON(data);
            } catch (err1) {
                try {
                    let proxyUrl = "https://api.allorigins.win/get?url=" + encodeURIComponent(METADATA_URL);
                    let response = await fetch(proxyUrl);
                    let data = await response.json();
                    let parsedData = JSON.parse(data.contents);
                    track = extractTrackFromJSON(parsedData);
                } catch (err2) {}
            }

            let historialGuardado = JSON.parse(localStorage.getItem("radio_historial_porcuna_v7")) || [];
            if (historialGuardado.length > 0) {
                actualizarPantallaHistorial(historialGuardado);
            }

            if (track && track !== lastRawTrack) {
                lastRawTrack = track;
                processTrackInfo(track);
            }
        }

        function extractTrackFromJSON(data) {
            if (!data || !data.icestats) return "";
            let source = data.icestats.source;
            if (Array.isArray(source)) {
                source = source.find(s => s.listenurl && s.listenurl.includes("/stream")) || source[0];
            }
            if (source) {
                return source.title || source.song || source.yp_currently_playing || "";
            }
            return "";
        }

        setInterval(fetchMetadata, 2000);
        fetchMetadata();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radio Porcuna</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #121212;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100dvh;
            overflow: hidden;
            padding: 15px;
        }

        .container {
            width: 100%;
            max-width: 340px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        /* Carátula / Logo circular */
        .artwork-container {
            width: 170px;
            height: 170px;
            border-radius: 50%;
            margin-bottom: 15px;
            box-shadow: 0 0 20px rgba(255, 30, 60, 0.5);
            overflow: hidden;
            border: 3px solid #ff2e4d;
            background-color: #000000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .artwork {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        h1 {
            font-size: 1.7rem;
            font-weight: 700;
            margin-bottom: 2px;
            letter-spacing: -0.5px;
        }

        .subtitle {
            font-size: 0.9rem;
            color: #ff7b89;
            margin-bottom: 15px;
            font-weight: 400;
        }

        /* Caja Sonando Ahora */
        .now-playing-box {
            width: 100%;
            background-color: #1a1a1a;
            border-radius: 12px;
            padding: 12px 10px;
            text-align: left;
            margin-bottom: 20px;
            border-left: 4px solid #ff2e4d;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .now-playing-label {
            font-size: 0.7rem;
            font-weight: 700;
            color: #ff2e4d;
            letter-spacing: 1px;
            margin-bottom: 4px;
            text-transform: uppercase;
        }

        .now-playing-title {
            font-size: 0.95rem;
            font-weight: 600;
            color: #ffffff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .now-playing-artist {
            font-size: 0.8rem;
            color: #a0a0a0;
            margin-top: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .play-btn {
            width: 100%;
            background: linear-gradient(180deg, #ff4d6d 0%, #ff1e3c 100%);
            color: #ffffff;
            border: none;
            border-radius: 30px;
            padding: 15px 20px;
            font-size: 1rem;
            font-weight: 800;
            letter-spacing: 0.5px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(255, 30, 60, 0.4);
        }

        .play-btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="artwork-container">
            <img id="artwork" class="artwork" src="https://cdn-profiles.tunein.com/s225357/images/logog.jpg" alt="Logo Radio">
        </div>

        <h1>Radio Porcuna</h1>
        <div class="subtitle">La radio de nuestra tierra</div>

        <div class="now-playing-box">
            <div class="now-playing-label">SONANDO AHORA:</div>
            <div id="songTitle" class="now-playing-title">Radio Porcuna - En directo</div>
            <div id="songArtist" class="now-playing-artist">106.9 FM</div>
        </div>

        <button id="playBtn" class="play-btn">ESCUCHAR EN DIRECTO</button>
    </div>

    <script>
        const DEFAULT_LOGO = "https://cdn-profiles.tunein.com/s225357/images/logog.jpg";
        const STREAM_URL = "https://canalretrohits.online:8443/stream";
        const METADATA_URL = "https://canalretrohits.online:8443/status-json.xsl";

        const playBtn = document.getElementById('playBtn');
        const artwork = document.getElementById('artwork');
        const songTitle = document.getElementById('songTitle');
        const songArtist = document.getElementById('songArtist');

        const audio = new Audio();
        let isPlaying = false;
        let lastRawTrack = "";
        let wakeLock = null;

        // Gestión del Wake Lock (evita que se apague la pantalla al reproducir)
        async function requestWakeLock() {
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                    wakeLock.addEventListener('release', () => { wakeLock = null; });
                }
            } catch (err) {
                console.error("Wake Lock error:", err);
            }
        }

        function releaseWakeLock() {
            if (wakeLock !== null) {
                wakeLock.release();
                wakeLock = null;
            }
        }

        // MediaSession para controles nativos y estabilidad en segundo plano
        function updateMediaSession(title, artist, artUrl) {
            if ('mediaSession' in navigator) {
                navigator.mediaSession.metadata = new MediaMetadata({
                    title: title,
                    artist: artist,
                    album: "Radio Porcuna 106.9 FM",
                    artwork: [{ src: artUrl, sizes: '512x512', type: 'image/jpeg' }]
                });
                navigator.mediaSession.setActionHandler('play', () => { startPlayback(); });
                navigator.mediaSession.setActionHandler('pause', () => { stopPlayback(); });
            }
        }

        function startPlayback() {
            audio.src = STREAM_URL + "?nocache=" + Date.now();
            audio.play().then(() => {
                playBtn.innerText = "PAUSAR EMISIÓN";
                isPlaying = true;
                requestWakeLock();
                updateMediaSession(songTitle.innerText, songArtist.innerText, artwork.src);
            }).catch(err => {
                alert("No se pudo conectar a la emisión.");
            });
        }

        function stopPlayback() {
            audio.pause();
            audio.src = "";
            playBtn.innerText = "ESCUCHAR EN DIRECTO";
            isPlaying = false;
            releaseWakeLock();
            if ('mediaSession' in navigator) {
                navigator.mediaSession.playbackState = "paused";
            }
        }

        playBtn.addEventListener('click', () => {
            if (!isPlaying) {
                startPlayback();
            } else {
                stopPlayback();
            }
        });

        // Buscar carátulas en iTunes
        async function searchArtwork(artist, title) {
            let query = `${artist} ${title}`.trim();
            try {
                let res = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(query)}&media=music&limit=1`);
                let data = await res.json();
                let artUrl = DEFAULT_LOGO;
                if (data.results && data.results.length > 0) {
                    artUrl = data.results[0].artworkUrl100.replace('100x100bb', '600x600bb');
                }
                artwork.src = artUrl;
                updateMediaSession(songTitle.innerText, songArtist.innerText, artUrl);
            } catch (e) {
                artwork.src = DEFAULT_LOGO;
            }
        }

        // Procesar metadatos
        function processTrackInfo(rawTrack) {
            if (!rawTrack || !rawTrack.trim() || rawTrack.includes("Radio Porcuna")) {
                songTitle.innerText = "Radio Porcuna - En directo";
                songArtist.innerText = "106.9 FM";
                artwork.src = DEFAULT_LOGO;
                updateMediaSession("Radio Porcuna - En directo", "106.9 FM", DEFAULT_LOGO);
                return;
            }

            let parts = rawTrack.split('-');
            let artist = "";
            let title = "";

            if (parts.length >= 2) {
                artist = parts[0].trim();
                title = parts.slice(1).join('-').trim();
            } else {
                artist = "Radio Porcuna 106.9 FM";
                title = rawTrack.trim();
            }

            songTitle.innerText = title;
            songArtist.innerText = artist;
            searchArtwork(artist, title);
        }

        function extractTrackFromJSON(data) {
            if (!data || !data.icestats) return "";
            let source = data.icestats.source;
            if (Array.isArray(source)) {
                source = source[0];
            }
            if (source) {
                return source.title || source.song || source.yp_currently_playing || "";
            }
            return "";
        }

        // Consulta de metadatos usando Proxy para evitar bloqueos CORS del navegador
        async function fetchMetadata() {
            try {
                let proxyUrl = "https://api.allorigins.win/raw?url=" + encodeURIComponent(METADATA_URL);
                let response = await fetch(proxyUrl);
                let data = await response.json();
                let track = extractTrackFromJSON(data);
                if (track && track !== lastRawTrack) {
                    lastRawTrack = track;
                    processTrackInfo(track);
                }
            } catch (err) {
                // Segundo respaldo de proxy por si falla el primero
                try {
                    let proxyUrlAlt = "https://corsproxy.io/?" + encodeURIComponent(METADATA_URL);
                    let response = await fetch(proxyUrlAlt);
                    let data = await response.json();
                    let track = extractTrackFromJSON(data);
                    if (track && track !== lastRawTrack) {
                        lastRawTrack = track;
                        processTrackInfo(track);
                    }
                } catch (err2) {
                    // Silencioso si hay problemas de red puntuales
                }
            }
        }

        document.addEventListener('visibilitychange', async () => {
            if (document.visibilityState === 'visible' && isPlaying) {
                if (wakeLock === null) await requestWakeLock();
                fetchMetadata();
            }
        });

        // Actualizar metadatos cada 2 segundos
        setInterval(fetchMetadata, 2000);
        fetchMetadata();
    </script>
</body>
</html>

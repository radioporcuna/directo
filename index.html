<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radio Porcuna</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #121212;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100dvh;
            overflow: hidden;
            padding: 15px;
        }

        .container {
            width: 100%;
            max-width: 340px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        /* Carátula / Logo circular */
        .artwork-container {
            width: 170px;
            height: 170px;
            border-radius: 50%;
            margin-bottom: 15px;
            box-shadow: 0 0 20px rgba(255, 30, 60, 0.5);
            overflow: hidden;
            border: 3px solid #ff2e4d;
            background-color: #000000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .artwork {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        h1 {
            font-size: 1.7rem;
            font-weight: 700;
            margin-bottom: 2px;
            letter-spacing: -0.5px;
        }

        .subtitle {
            font-size: 0.9rem;
            color: #ff7b89;
            margin-bottom: 18px;
            font-weight: 400;
        }

        /* Caja Sonando Ahora */
        .now-playing-box {
            width: 100%;
            background-color: #1a1a1a;
            border-radius: 12px;
            padding: 12px 16px;
            text-align: left;
            margin-bottom: 20px;
            border-left: 4px solid #ff2e4d;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .now-playing-label {
            font-size: 0.7rem;
            font-weight: 700;
            color: #ff2e4d;
            letter-spacing: 1px;
            margin-bottom: 4px;
            text-transform: uppercase;
        }

        .now-playing-title {
            font-size: 0.95rem;
            font-weight: 600;
            color: #ffffff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .now-playing-artist {
            font-size: 0.8rem;
            color: #a0a0a0;
            margin-top: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Botón Play */
        .play-btn {
            width: 100%;
            background: linear-gradient(180deg, #ff4d6d 0%, #ff1e3c 100%);
            color: #ffffff;
            border: none;
            border-radius: 30px;
            padding: 15px 20px;
            font-size: 1rem;
            font-weight: 800;
            letter-spacing: 0.5px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(255, 30, 60, 0.4);
        }

        .play-btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="artwork-container">
            <img id="artwork" class="artwork" src="https://cdn-profiles.tunein.com/s225357/images/logog.jpg" alt="Radio Porcuna">
        </div>

        <h1>Radio Porcuna</h1>
        <div class="subtitle">La radio de nuestra tierra</div>

        <div class="now-playing-box">
            <div class="now-playing-label">SONANDO AHORA:</div>
            <div id="songTitle" class="now-playing-title">Radio Porcuna - En directo</div>
            <div id="songArtist" class="now-playing-artist">106.9 FM</div>
        </div>

        <button id="playBtn" class="play-btn">ESCUCHAR EN DIRECTO</button>
    </div>

    <script>
        const DEFAULT_LOGO = "https://cdn-profiles.tunein.com/s225357/images/logog.jpg"; 
        const STREAM_URL = "https://canalretrohits.online:8443/stream";
        const METADATA_URL = "https://canalretrohits.online:8443/status-json.xsl";

        const playBtn = document.getElementById('playBtn');
        const artwork = document.getElementById('artwork');
        const songTitle = document.getElementById('songTitle');
        const songArtist = document.getElementById('songArtist');

        const audio = new Audio();
        let isPlaying = false;
        let lastRawTrack = "";

    // --- BLOQUE PARA QUE NO SE APAGUE LA PANTALLA ---
    let wakeLock = null;

    async function requestWakeLock() {
        try {
            if ('wakeLock' in navigator) {
                wakeLock = await navigator.wakeLock.request('screen');
                wakeLock.addEventListener('release', () => { wakeLock = null; });
            }
        } catch (err) {}
    }

    document.addEventListener('visibilitychange', async () => {
        if (wakeLock === null && document.visibilityState === 'visible' && isPlaying) {
            await requestWakeLock();
        }
    });
    // ------------------------------------------------

    playBtn.addEventListener('click', () => {
        if (!isPlaying) {
            audio.src = STREAM_URL + "?nocache=" + Date.now();
            audio.play().then(() => {
                playBtn.innerText = "PAUSAR EMISIÓN";
                isPlaying = true;
                requestWakeLock(); // <--- Activa el bloqueo aquí al pulsar Play
            }).catch(e => {

            playBtn.addEventListener('click', () => {
    if (!isPlaying) {
        audio.src = STREAM_URL + "?nocache=" + Date.now();
        audio.play().then(() => {
            playBtn.innerText = "PAUSAR EMISIÓN";
            isPlaying = true;
            requestWakeLock();
        }).catch(e => {
            // Se elimina el alert para que no moleste al usuario
            console.log("Reintentando conexión...");
        });
    } else {
        audio.pause();
        audio.src = "";
        playBtn.innerText = "ESCUCHAR EN DIRECTO";
        isPlaying = false;
    }
});

                
            audio.pause();
            audio.src = "";
            playBtn.innerText = "ESCUCHAR EN DIRECTO";
            isPlaying = false;
            
            // --- Libera el bloqueo aquí al pulsar Pausa ---
            if (wakeLock !== null) {
                wakeLock.release();
                wakeLock = null;
            }
        }
    });

        playBtn.addEventListener('click', () => {
            if (!isPlaying) {
                audio.src = STREAM_URL + "?nocache=" + Date.now();
                audio.play().then(() => {
                    playBtn.innerText = "PAUSAR EMISIÓN";
                    isPlaying = true;
                }).catch(err => {
                    alert("No se pudo conectar a la emisión.");
                });
            } else {
                audio.pause();
                audio.src = "";
                playBtn.innerText = "ESCUCHAR EN DIRECTO";
                isPlaying = false;
            }
        });

        async function searchArtwork(artist, title) {
            let query = `${artist} ${title}`.trim();
            try {
                let res = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(query)}&media=music&limit=1`);
                let data = await res.json();

                if (data.results && data.results.length > 0) {
                    let track = data.results[0];
                    artwork.src = track.artworkUrl100.replace('100x100bb', '600x600bb');
                } else {
                    artwork.src = DEFAULT_LOGO;
                }
            } catch (e) {
                artwork.src = DEFAULT_LOGO;
            }
        }

        function processTrackInfo(rawTrack) {
            if (!rawTrack || rawTrack.trim() === "" || rawTrack.includes("Radio Porcuna")) {
                songTitle.innerText = "Radio Porcuna - En directo";
                songArtist.innerText = "106.9 FM";
                artwork.src = DEFAULT_LOGO;
                return;
            }

            let parts = rawTrack.split('-');
            let artist = "";
            let title = "";

            if (parts.length >= 2) {
                artist = parts[0].trim();
                title = parts.slice(1).join('-').trim();
            } else {
                artist = "Radio Porcuna 106.9 FM";
                title = rawTrack.trim();
            }

            songTitle.innerText = title;
            songArtist.innerText = artist;

            searchArtwork(artist, title);
        }

        async function fetchMetadata() {
            let track = "";

            // Intento 1: Directo al Icecast
            try {
                let response = await fetch(METADATA_URL, { cache: "no-store" });
                let data = await response.json();
                track = extractTrackFromJSON(data);
            } catch (err) {
                // Intento 2: Proxy AllOrigins para saltar bloqueo CORS
                try {
                    let proxyUrl = "https://api.allorigins.win/raw?url=" + encodeURIComponent(METADATA_URL + "?ts=" + Date.now());
                    let response = await fetch(proxyUrl);
                    let data = await response.json();
                    track = extractTrackFromJSON(data);
                } catch (err2) {
                    // Intento 3: Proxy Corsproxy
                    try {
                        let proxyUrl2 = "https://corsproxy.io/?" + encodeURIComponent(METADATA_URL);
                        let response = await fetch(proxyUrl2);
                        let data = await response.json();
                        track = extractTrackFromJSON(data);
                    } catch (err3) {}
                }
            }

            if (track && track !== lastRawTrack) {
                lastRawTrack = track;
                processTrackInfo(track);
            }
        }

        function extractTrackFromJSON(data) {
            if (!data || !data.icestats) return "";
            let source = data.icestats.source;
            if (Array.isArray(source)) {
                source = source[0];
            }
            if (source) {
                return source.title || source.song || source.yp_currently_playing || "";
            }
            return "";
        }

        setInterval(fetchMetadata, 4000);
        fetchMetadata();
    </script>
</body>
</html>
